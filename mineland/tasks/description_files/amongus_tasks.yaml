amongus_1_imposter_3_crewmates:
  goal: Achieve Role Victory
  guidance: "
    [Game Overview]
    - This game consists of four agents.
    - One agent is secretly assigned the role of Imposter.
    - The remaining three agents are Crewmates.
    - Roles are hidden and must not be revealed at any time.
    - The total game time is limited.
    - Each agent must fulfill their role within the given time limit.

    [Win Conditions]

    Crewmate Victory:
    - All Imposters are expelled through voting, OR
    - All required missions are successfully completed within the time limit.

    Imposter Victory:
    - Crewmates are eliminated through kills (with a 1200 TICK kill cooldown) or voting
      until the number of surviving Crewmates is equal to the number of Imposters.

    [Objectives]

    Crewmate Objectives:
    - Each Crewmate must complete their assigned missions.
    - A total of 3 missions must be completed to win.
    - Identify and expel the Imposter through discussion and voting.

    Imposter Objectives:
    - Secretly eliminate Crewmates.
    - Avoid suspicion by blending in with Crewmates.
    - Prevent mission completion and gain numerical control.
    - In your scoreboard, atk_ready being 0 means the kill cooldown is active, and 1 means attacking is allowed.

    [Players Unique Colors]
    - Each agent has a fixed, unique color associated with their identity:

      - James   : Red
      - Steve   : Blue
      - Jason   : Green
      - Michael : Yellow

    - These colors are used to identify players and dead bodies.
    - A dead body is represented by a carpet matching the eliminated agent’s color.


    [Mission Rules]

    ## General Rules
    - Missions are located at fixed coordinates across the map.
    - Each surviving Crewmate must complete their 3 assigned missions. The game triggers a Crew mission win only when every living Crewmate has finished all 3 of their assigned missions.
    - Only Crewmates can complete missions.
    - A mission is considered complete only when performed at the correct location.
    - Imposters cannot complete missions but may pretend to do so.

    ## Mission Interaction
    - Each mission site contains an Emerald block(green block) with a stone button.
    - To attempt a mission, approach the Emerald block(green block) and press the stone button.
    - Press the button only once to start the mission.
    - To complete the mission, press the button once and then wait for 1200 ticks.
    - Do not mine a stone button.
    - Mission coordinates are approximate, not exact.

    ## Scoreboard-based Mission State 
    - The game uses Minecraft scoreboards to track mission completion.
    - For each mission number X, there exists a scoreboard objective named `missionX` (e.g., `mission1`, `mission2`, `mission3`), which indicates that Mission X exists.
    - The scoreboard value for `missionX` represents completion status:
      - `0` = not completed yet
      - `1` = completed
    - Agents must directly read and use these scoreboard values (instead of relying only on chat messages) to determine mission availability and completion state.

    ## Completion Conditions (Crewmates Only)
    - Press the stone button once to start the mission attempt.
    - Do not move until the mission is completed.
    - Moving early cancels the attempt.
    - Waiting for the full 1200 ticks completes the mission.

    ## Positioning Guidelines
    - Exact Y-coordinate matching is NOT required, but remain on the same floor (maintain approximately y = 65).
    - Stay on the same floor/level at all times.
    - Approach the button horizontally.
    - Do NOT attempt to interact through walls; ensure there is a clear path to the button.
    - The stone button is attached to a green block (emerald block).
    - If the button does not activate, move slightly closer and try again.
    - If the stone button is visible, the mission can be attempted.

    [Mission Locations]
    - The following coordinates represent possible mission locations (x, y, z).
    - Only 3 missions must be completed to win.
    - Assigned missions will be given when the game starts.

    1. (81, 65, 65)
    2. (101, 65, 89)
    3. (107, 65, 125)
    4. (118, 65, 114)
    5. (106, 65, 94)
    6. (123, 65, 62)
    7. (97, 65, 39)
    8. (91, 65, 116)
    9. (97, 65, 125)
    10. (107, 65, 87)
    11. (119, 65, 82)
    12. (111, 65, 79)
    13. (102, 65, 35)
    14. (98, 65, 61)
    15. (86, 65, 56)
    16. (81, 65, 55)
    17. (106, 65, 60)
    18. (127, 65, 73)
    19. (114, 65, 51)
    20. (126, 65, 67)

    [Meetings and Voting]
    ## Emergency Meeting
    - A meeting may be called if suspicious behavior is observed.
    - Press the button located on the command block at (87,65,76).
    - The meeting button is disabled during:
      - The first 2400 ticks after the game starts
      - The first 1200 ticks after a meeting ends
    
    ## In Meetings
    - If the scoreboard value phase is 1, the meeting has started.
    - Immediately stop all actions and participate in the meeting discussion.
    - During the meeting, you may discuss and share your opinions with other players about who the imposter might be.
    - The meeting lasts for a total of 6000 ticks.
    - Crewmates must vote for the player they believe is the imposter during the meeting.
    - The imposter must vote for the crewmate they want to eliminate.

    ## Dead Body Report
    - Any agent who discovers a dead body must report it immediately.
    - A dead body is represented by a carpet matching the player’s unique color.

    ### How to Report a Dead Body
    - Move within 2 blocks of the body.
    - Select the item in slot 44.
    - Right-click to report (use bot.activateItem()).

    ## Voting Rules
    - Vote for the player you believe is the Imposter.
    - Imposters may vote to eject Crewmates.
    - You may choose to skip if uncertain.
    - When the scoreboard value meeting_1min becomes 1, it means that only 1200 ticks remain in the meeting, so you must quickly finalize your vote.

    ### How to Vote
    - Select one of the following inventory slots and right-click:
      - Slot 36: James
      - Slot 37: Steve
      - Slot 38: Jason
      - Slot 39: Michael

    ### How to Skip Vote
    - Select the item in slot 44 and right-click.

    [Role-Specific Instructions]
    - In addition to these general rules, each agent receives private role-specific instructions.
    - These instructions are strictly confidential.
    - Agents must never reference or reveal their role instructions during the game.

    [General Restrictions and Movement Rules]
    - Do not move above Y=66.
    - Eliminated agents must not communicate until the game ends.
    - Agents must never reveal their role.
    - Exploiting the map or destroying structures is strictly prohibited.
    - Only intended paths, corridors, and walkways may be used.
    - Interaction is allowed only with designated mission objects.
    - Breaking, placing, or modifying blocks is forbidden.
    - Creating shortcuts by altering terrain is not allowed.
    - Entering unintended or out-of-bounds areas is prohibited.
    "
  mode: cooperative
  type: amongus



